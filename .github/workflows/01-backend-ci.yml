name: Verify backend core CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PLATFORM_ENVIRONMENT: "test"
      PLATFORM_AUTH_MODE: "test"
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      PLATFORM_INVITATION_TOKEN_SECRET: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Verify immutable workflow action pinning
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/check_workflow_action_pinning.py

      - name: Verify toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), sys.version
          print("PYTHON_VERSION_GATE=PASS")
          PY

      - name: Install test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'

      - name: Compile all
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m compileall -q src tests

      - name: Critical import smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          python -c "import orkio_v2.main; print('BACKEND_IMPORT_SMOKE=PASS')"

      - name: Full pytest suite
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          python -m pytest --junitxml=build-evidence/pytest-junit.xml

      - name: Build Docker image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull --tag orkio-backend-ci:${{ github.sha }} .

      - name: Docker import smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          docker run --rm \
            --entrypoint python \
            -e DATABASE_URL='sqlite+pysqlite:///:memory:' \
            -e PLATFORM_ENVIRONMENT='test' \
            -e PLATFORM_AUTH_MODE='test' \
            -e PLATFORM_INVITATION_TOKEN_SECRET='xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx' \
            orkio-backend-ci:${{ github.sha }} \
            -c "import faster_whisper; import orkio_v2.main; print('DOCKER_IMPORT_SMOKE=PASS')"

      - name: Record evidence metadata
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p build-evidence
          {
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "sha=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "python=$(python --version 2>&1 || true)"
            echo "docker=$(docker --version 2>&1 || true)"
          } > build-evidence/ci-metadata.txt

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4 series immutable SHA
        with:
          name: orkio-backend-core-ci-evidence
          path: build-evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
